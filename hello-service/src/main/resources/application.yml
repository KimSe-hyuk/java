server:
  port: 7777
  tomcat:
    connection-timeout: 2s
    keep-alive-timeout: 15s
    threads:
      max: 50
      min-spare: 5
  shutdown: graceful
spring:
  application:
    name:  hello-service
  lifecycle:
    timeout-per-shutdown-phase: 15s
  cloud:
    config:
      uri: ${SPRING_CLOUD_CONFIG_URI:http://localhost:7777}
      request-connect-timeout: 5000
      request-read-timeout: 5000
      fail-fast: true
      retry:
        max-attempts: 6
        initial-interval: 1000
        max-interval: 2000
        multiplier: 1.1
      enabled: false

      resources:
       static-locations: classpath:/static/

feign-data:
  url: ${ORDER_SERVICE_URL:http://localhost:9002}
